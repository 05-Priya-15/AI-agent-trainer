name: AgentGuard Security Gate

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  security:

    name: AgentGuard AI Security Tests

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AgentGuard security gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py \
            --suite full \
            --fail-on-vulnerability \
            --no-browser

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-json-report
          path: reports/*.json
          if-no-files-found: warn

      - name: Upload HTML dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-html-dashboard
          path: reports/*.html
          if-no-files-found: warn