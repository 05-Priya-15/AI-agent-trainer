name: AgentGuard Security Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python regression tests
        run: |
          pytest tests/test_runtime_config.py --maxfail=1

  frontend-build:
    name: Frontend build validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  security-tests:
    name: AgentGuard AI Security Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AgentGuard security gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py \
            --suite full \
            --fail-on-vulnerability \
            --no-browser

      - name: Upload JSON security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentguard-json-report
          path: reports/*.json
          if-no-files-found: ignore

      - name: Upload HTML security dashboard
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agentguard-html-dashboard
          path: reports/*.html
          if-no-files-found: ignore